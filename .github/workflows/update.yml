name: Обновить и проверить конфиги

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить серверы
        run: python check.py

      - name: Отправить список в хранилище
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          base="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_NAMESPACE_ID/values"
          if [ -s sub_plain.txt ]; then
            curl -fsS -X PUT "$base/sub" -H "Authorization: Bearer $CF_API_TOKEN" --data-binary @sub_plain.txt > /dev/null
          fi
          curl -fsS -X PUT "$base/status" -H "Authorization: Bearer $CF_API_TOKEN" --data-binary @status.json > /dev/null

      - name: Сохранить счётчики
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add status.json
          git commit -m "Обновление счётчиков" || echo "Без изменений"
          git pull --rebase
          git push
