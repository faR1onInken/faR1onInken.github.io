name: Обновить и проверить конфиги

on:
  schedule:
    - cron: "0 */3 * * *"   # каждые 3 часа
  workflow_dispatch:         # и вручную кнопкой Run workflow

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить серверы
        run: python check.py

      - name: Сохранить результат
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add sub.txt sub_plain.txt status.json
          git commit -m "Обновление списка" || echo "Без изменений"
          git push
